name: Finalize adoption rollout

on:
  push:
    paths:
      - '.github/workflows/finalize-adoption-rollout.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update adoption pages and impact metrics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Expected text not found: {label}")
              return text.replace(old, new, 1)

          # Homepage 2026 adoption impact
          path = Path('src/app/page.tsx')
          text = path.read_text()
          old = '''              <div className="text-4xl md:text-5xl font-bold text-primary">—</div>
              <p className="text-foreground font-semibold">Animals Adopted Into Homes</p>
              <p className="text-sm text-muted-foreground max-w-xs mx-auto">
                Creating lasting connections between shelter animals and their new families.
              </p>
              <p className="text-xs font-medium uppercase tracking-wide text-primary">2026 total coming soon</p>'''
          new = '''              <div className="text-4xl md:text-5xl font-bold text-primary">84</div>
              <p className="text-foreground font-semibold">Animals Adopted Into Homes</p>
              <p className="text-sm text-muted-foreground max-w-xs mx-auto">
                52 cats and 32 dogs connected with new families in 2026.
              </p>'''
          text = replace_once(text, old, new, 'homepage adoption impact')
          path.write_text(text)

          # About page lifetime adoption impact
          path = Path('src/app/about/page.tsx')
          text = path.read_text()
          marker = '''      {/* Our Story */}'''
          insertion = '''      {/* Adoption Impact */}
      <section className="section-padding bg-primary/5">
        <div className="container-custom max-w-3xl text-center">
          <div className="text-5xl md:text-6xl font-bold text-primary">4,193</div>
          <h2 className="text-2xl md:text-3xl font-bold mt-3">Animals Adopted Through Safe Haven</h2>
          <p className="text-muted-foreground mt-3">More than four thousand cats and dogs have found homes through Safe Haven Humane Society.</p>
        </div>
      </section>

      {/* Our Story */}'''
          text = replace_once(text, marker, insertion, 'about lifetime adoption impact')
          path.write_text(text)

          # Adopt page: remove simulated modal form and point to the real application
          path = Path('src/app/adopt/page.tsx')
          text = path.read_text()
          text = replace_once(text,
              '''import { Dialog, DialogContent, DialogHeader, DialogTitle } from "@/components/ui/dialog"\nimport { AdoptionForm } from "@/components/adoption-form"\n''',
              '',
              'old adoption form imports')
          text = replace_once(text,
              '''  const [selectedPet, setSelectedPet] = useState<string | null>(null)\n  const [showApplicationForm, setShowApplicationForm] = useState(false)\n''',
              '',
              'old adoption form state')
          text = replace_once(text,
              '''  const handleAdoptClick = (petName: string) => {\n    setSelectedPet(petName)\n    setShowApplicationForm(true)\n  }\n\n''',
              '',
              'old adoption click handler')
          text = replace_once(text,
              '''              All of our pets are spayed/neutered, vaccinated, and ready for their forever homes.''',
              '''              Adoptable pets receive age-appropriate veterinary care and preparation before placement.''',
              'adoption hero medical claim')
          text = replace_once(text,
              '''                    <Button className="w-full" onClick={() => handleAdoptClick(pet.name)}>
                      Apply to Adopt {pet.name}
                    </Button>''',
              '''                    <Button asChild className="w-full">
                      <Link href="/adoption-application">Start an Adoption Application</Link>
                    </Button>''',
              'pet card application button')
          old_process = '''            <div className="grid grid-cols-1 md:grid-cols-3 gap-6 text-left pt-6">
              <div className="space-y-2">
                <div className="h-8 w-8 rounded-full bg-primary/10 flex items-center justify-center font-bold text-primary">1</div>
                <h3 className="font-semibold">Fill Out Application</h3>
                <p className="text-sm text-muted-foreground">Tell us about your home, lifestyle, and what you're looking for.</p>
              </div>
              <div className="space-y-2">
                <div className="h-8 w-8 rounded-full bg-primary/10 flex items-center justify-center font-bold text-primary">2</div>
                <h3 className="font-semibold">Meet & Greet</h3>
                <p className="text-sm text-muted-foreground">Visit the shelter to spend time with your potential new friend.</p>
              </div>
              <div className="space-y-2">
                <div className="h-8 w-8 rounded-full bg-primary/10 flex items-center justify-center font-bold text-primary">3</div>
                <h3 className="font-semibold">Take Them Home</h3>
                <p className="text-sm text-muted-foreground">Complete the adoption and start your journey together!</p>
              </div>
            </div>'''
          new_process = '''            <div className="grid grid-cols-1 md:grid-cols-4 gap-6 text-left pt-6">
              <div className="space-y-2">
                <div className="h-8 w-8 rounded-full bg-primary/10 flex items-center justify-center font-bold text-primary">1</div>
                <h3 className="font-semibold">Apply</h3>
                <p className="text-sm text-muted-foreground">Tell us about your home, lifestyle, and what you're looking for.</p>
              </div>
              <div className="space-y-2">
                <div className="h-8 w-8 rounded-full bg-primary/10 flex items-center justify-center font-bold text-primary">2</div>
                <h3 className="font-semibold">Review</h3>
                <p className="text-sm text-muted-foreground">Our team reviews your application and contacts you if we need more information.</p>
              </div>
              <div className="space-y-2">
                <div className="h-8 w-8 rounded-full bg-primary/10 flex items-center justify-center font-bold text-primary">3</div>
                <h3 className="font-semibold">Meet &amp; Match</h3>
                <p className="text-sm text-muted-foreground">Meet animals who may be a good fit for your household and needs.</p>
              </div>
              <div className="space-y-2">
                <div className="h-8 w-8 rounded-full bg-primary/10 flex items-center justify-center font-bold text-primary">4</div>
                <h3 className="font-semibold">Adopt</h3>
                <p className="text-sm text-muted-foreground">Complete the adoption and welcome your new companion home.</p>
              </div>
            </div>
            <div className="pt-4">
              <Button asChild size="lg">
                <Link href="/adoption-application">Start an Adoption Application</Link>
              </Button>
            </div>'''
          text = replace_once(text, old_process, new_process, 'adoption process')
          old_dialog = '''      <Dialog open={showApplicationForm} onOpenChange={setShowApplicationForm}>
        <DialogContent>
          <DialogHeader onClose={() => setShowApplicationForm(false)}>
            <DialogTitle>Adoption Application</DialogTitle>
          </DialogHeader>
          <AdoptionForm
            petName={selectedPet || ""}
            onClose={() => setShowApplicationForm(false)}
          />
        </DialogContent>
      </Dialog>
'''
          text = replace_once(text, old_dialog, '', 'simulated adoption dialog')
          path.write_text(text)

          # Remove this one-time workflow after it has done its job.
          Path('.github/workflows/finalize-adoption-rollout.yml').unlink()
          PY
      - name: Commit finalized adoption rollout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.tsx src/app/about/page.tsx src/app/adopt/page.tsx .github/workflows/finalize-adoption-rollout.yml
          git commit -m "Finalize adoption application rollout and impact metrics"
          git push
