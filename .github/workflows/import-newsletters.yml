name: Import newsletter PDFs

on:
  issues:
    types: [opened]

permissions:
  contents: write

jobs:
  import:
    if: github.event.issue.title == '[newsletter-import] Import Deb newsletters'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download newsletter PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/newsletters
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-febc-81f5-928a-d3000beb032e/raw?se=2026-09-17T16%3A33%3A16Z&sp=r&sv=2026-02-06&sr=b&scid=46ad441c-4016-56aa-bcd5-f25790deec50&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T14%3A59%3A41Z&ske=2026-09-18T14%3A59%3A41Z&sks=b&skv=2026-02-06&sig=LulrR7ffMCA61iHkuVW2OFg4ZildzT3IsMUZ77Ysx6A%3D' -o public/newsletters/safe-haven-spring-summer-2025.pdf
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-d05c-81f5-928d-53a18da037b6/raw?se=2026-09-17T16%3A33%3A40Z&sp=r&sv=2026-02-06&sr=b&scid=10abd254-3e95-5904-a299-c072fa99b84d&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T13%3A41%3A46Z&ske=2026-09-18T13%3A41%3A46Z&sks=b&skv=2026-02-06&sig=DtApQTjI/YLu8F9zVuuB03yOwFQlC/l%2BhlGF2k3l9rU%3D' -o public/newsletters/safe-haven-summer-fall-2025.pdf
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-14b8-81f5-9986-e1c76742a898/raw?se=2026-09-17T16%3A33%3A52Z&sp=r&sv=2026-02-06&sr=b&scid=802d5e18-52be-515c-a609-6ae42b9706ee&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T12%3A17%3A55Z&ske=2026-09-18T12%3A17%3A55Z&sks=b&skv=2026-02-06&sig=AwOFetp4LKE5yfHQn/hvamz15DdGrOP5LdXRpw1k/BY%3D' -o public/newsletters/safe-haven-spring-2026.pdf
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3bac-81f5-82c9-f43d2c098c7f/raw?se=2026-09-17T16%3A34%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=12c377de-28e3-5989-bf6f-a90cfa403950&skoid=d1cabc79-3240-4866-94fe-6005330cb49e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-17T12%3A25%3A34Z&ske=2026-09-18T12%3A25%3A34Z&sks=b&skv=2026-02-06&sig=mlschTydO41kXkw1ynq%2B2RR3XAcZ/sbTi5qjpHl1/Qs%3D' -o public/newsletters/safe-haven-summer-2026.pdf
          test $(stat -c%s public/newsletters/safe-haven-spring-summer-2025.pdf) -gt 1900000
          test $(stat -c%s public/newsletters/safe-haven-summer-fall-2025.pdf) -gt 14000000
          test $(stat -c%s public/newsletters/safe-haven-spring-2026.pdf) -gt 2000000
          test $(stat -c%s public/newsletters/safe-haven-summer-2026.pdf) -gt 2200000
      - name: Commit PDFs and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/import-newsletters.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/newsletters .github/workflows/import-newsletters.yml
          git commit -m 'Add updated Safe Haven newsletter PDFs'
          git push origin HEAD:main
