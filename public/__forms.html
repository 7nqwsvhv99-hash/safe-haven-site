<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8"><title>Safe Haven Forms</title></head>
  <body>
    <form name="volunteer-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="volunteer-application">
      <input name="subject">
      <input name="bot-field">
      <input name="firstName">
      <input name="lastName">
      <input name="ageRange">
      <input name="email">
      <input name="streetAddress">
      <input name="unitApt">
      <input name="city">
      <input name="state">
      <input name="zip">
      <input name="homePhone">
      <input name="workPhone">
      <input name="cellPhone">
      <input name="preferredContact">
      <input name="employmentStatus">
      <input name="employer">
      <input name="schoolStatus">
      <input name="howHeard">
      <input name="howHeardDetails">
      <input name="readyToVolunteer">
      <input name="daysAvailable">
      <input name="timesAvailable">
      <input name="previousRescueVolunteer">
      <input name="previousOrganizations">
      <textarea name="previousDuties"></textarea>
      <input name="currentDog">
      <input name="pastDog">
      <input name="dogBreedExperience">
      <input name="currentCat">
      <input name="pastCat">
      <textarea name="animalExperience"></textarea>
      <input name="volunteerInterests">
      <textarea name="anythingElse"></textarea>
      <input name="authorizationAgreed">
    </form>
  </body>
</html>
